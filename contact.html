<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact P.J. DelHomme</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Config (Matching your Index file) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'mt-paper': '#F9F9F7',    
                        'mt-slate': '#1E293B',    
                        'mt-blue': '#334155',
                        'mt-green': '#243B2E',    
                        'mt-sage': '#6B8E78',
                        'mt-stone': '#64748B',    
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-mt-paper text-mt-slate antialiased flex flex-col min-h-screen">

    <!-- Simple Navigation -->
    <nav class="w-full py-6 px-6 md:px-12 flex justify-between items-center border-b border-gray-200 bg-white/90 backdrop-blur-md sticky top-0 z-50">
        <a href="index.html" class="text-xl font-serif font-bold tracking-tight text-mt-green hover:opacity-80 transition">P.J. DelHomme</a>
        <a href="index.html" class="text-sm font-sans font-medium text-mt-stone hover:text-mt-green transition-colors uppercase tracking-wider">
            &larr; Back to Home
        </a>
    </nav>

    <!-- Contact Form Section -->
    <div class="flex-grow flex items-center justify-center py-20 px-6">
        <div class="w-full max-w-2xl bg-white p-8 md:p-12 rounded-sm shadow-lg border-t-4 border-mt-green">
            
            <div class="text-center mb-10">
                <h1 class="text-3xl md:text-4xl font-serif font-bold text-mt-green mb-4">Get In Touch</h1>
                <p class="text-gray-600 font-sans text-lg">
                    Have a project in mind? Let’s start the conversation.
                </p>
            </div>

            <!-- NETLIFY FORM -->
            <form name="contact" method="POST" data-netlify="true" class="space-y-6">
                
                <!-- Hidden input for Netlify bot detection -->
                <input type="hidden" name="form-name" value="contact" />

                <div class="grid md:grid-cols-2 gap-6">
                    <!-- Name -->
                    <div>
                        <label for="name" class="block text-sm font-bold text-mt-slate uppercase tracking-wide mb-2">Name</label>
                        <input type="text" id="name" name="name" required 
                            class="w-full bg-mt-paper border border-gray-300 p-3 rounded-sm focus:outline-none focus:border-mt-green focus:ring-1 focus:ring-mt-green transition">
                    </div>
                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-bold text-mt-slate uppercase tracking-wide mb-2">Email</label>
                        <input type="email" id="email" name="email" required 
                            class="w-full bg-mt-paper border border-gray-300 p-3 rounded-sm focus:outline-none focus:border-mt-green focus:ring-1 focus:ring-mt-green transition">
                    </div>
                </div>

                <!-- Service Selection -->
                <div>
                    <label for="service" class="block text-sm font-bold text-mt-slate uppercase tracking-wide mb-2">What do you need help with?</label>
                    <div class="relative">
                        <select id="service" name="service" class="w-full bg-mt-paper border border-gray-300 p-3 rounded-sm appearance-none focus:outline-none focus:border-mt-green focus:ring-1 focus:ring-mt-green transition cursor-pointer">
                            <option value="Writing">Feature Writing / Copywriting</option>
                            <option value="Editing">Editing / Ghostwriting</option>
                            <option value="Strategy">Content Strategy / SEO</option>
                            <option value="Consulting">Media Consulting</option>
                            <option value="Other">Other</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-mt-stone">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>

                <!-- Message -->
                <div>
                    <label for="message" class="block text-sm font-bold text-mt-slate uppercase tracking-wide mb-2">Project Details</label>
                    <textarea id="message" name="message" rows="5" required 
                        class="w-full bg-mt-paper border border-gray-300 p-3 rounded-sm focus:outline-none focus:border-mt-green focus:ring-1 focus:ring-mt-green transition"
                        placeholder="Tell me a bit about the scope, timeline, and goals..."></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-mt-green text-white font-sans font-bold py-4 rounded-sm hover:bg-mt-blue transition-colors shadow-md tracking-wide uppercase text-sm">
                    Send Message
                </button>
            </form>

        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full py-8 text-center border-t border-gray-200 bg-white">
        <p class="text-xs text-mt-stone uppercase tracking-widest">&copy; 2024 P.J. DelHomme. All Rights Reserved.</p>
    </footer>

</body>
</html>
